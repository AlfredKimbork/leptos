[package]
name = 'leptos'
version = '0.1.0'
edition = '2024'

[dependencies]
leptos = { version = '0.8', features = ['csr'] }
serde = { version = '1.0', features = ['derive'] }
serde_json = '1.0'
web-sys = { version = '0.3', features = ['Window', 'Storage'] }
uuid = { version = "1", features = ["v4", "js", "serde"] }
